<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horas</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
</head>

<body>
    <div class="container">
        <h1>Control de Horas</h1>
        <div class="dashboard">
            <div class="card">
                <h3>Total Horas</h3>
                <p id="total-horas">EUR 0.00 hrs</p>
            </div>
            <div class="card highlight">
                <h3>Total Ganado</h3>
                <p id="total-dinero">EUR 0.00</p>
            </div>
        </div>
    </div>

    <!-- Formulario -->
    <form id="work-form" class="form-container">
        <h2>Registrar Jornada</h2>

        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="hora-inicio">Hora Inicio</label>
                <input type="time" id="hora-inicio" required>
            </div>
            <div class="form-group">
                <label for="hora-fin">Hora Fin</label>
                <input type="time" id="hora-fin" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="descanso">Descanso (minutos)</label>
                <input type="number" id="descanso" min="0" value="0" placeholder="Ej: 30">
            </div>
            <div class="form-group">
                <label for="tarifa">Precio / Hora (€ o $)</label>
                <input type="number" id="tarifa" step="0.01" min="0" placeholder="Ej: 10.50" required>
            </div>
        </div>

        <div class="form-group">
            <label for="notas">Notas / Proyecto (Opcional)</label>
            <input type="text" id="notas" placeholder="Ej: Cliente X, Proyecto Y">
        </div>

        <button type="submit" class="btn-submit">Guardar Registro</button>
    </form>

    <!-- Historial -->
    <div class="history-container">
        <h2>Historial de Registros</h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Horas Netas</th>
                        <th>Ganado</th>
                        <th>Notas</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="registros-tabla">
                    <!-- Las filas se cargan dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
