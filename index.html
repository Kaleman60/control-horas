<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Horas y Tareas</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
</head>
<body>
    <div class="container">
        <h1>⏱️ Control de Horas y Tareas</h1>

        <!-- Tarjetas de Resumen -->
        <div class="dashboard">
            <div class="card">
                <h3>Total Horas</h3>
                <p id="total-horas">0.00 hrs</p>
            </div>
            <div class="card highlight">
                <h3>Total Ganado</h3>
                <p id="total-dinero">$0.00</p>
            </div>
        </div>

        <!-- Pestañas de Navegación -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="jornada-section">⏱️ Registrar Jornada</button>
            <button class="tab-btn" data-tab="tareas-section">📅 Próximas Tareas</button>
        </div>

        <!-- Sección 1: Formulario de Jornada -->
        <div id="jornada-section" class="tab-content active">
            <form id="work-form" class="form-container">
                <h2>Registrar Jornada Trabajada</h2>
                
                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="hora-inicio">Hora Inicio</label>
                        <input type="time" id="hora-inicio" required>
                    </div>
                    <div class="form-group">
                        <label for="hora-fin">Hora Fin</label>
                        <input type="time" id="hora-fin" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="descanso">Descanso (min)</label>
                        <input type="number" id="descanso" min="0" value="0" placeholder="Ej: 30">
                    </div>
                    <div class="form-group">
                        <label for="tarifa">Precio / Hora (€ o $)</label>
                        <input type="number" id="tarifa" step="0.01" min="0" placeholder="Ej: 10.50" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notas">Notas / Proyecto (Opcional)</label>
                    <input type="text" id="notas" placeholder="Ej: Cliente X, Proyecto Y">
                </div>

                <button type="submit" class="btn-submit">Guardar Jornada</button>
            </form>
        </div>

        <!-- Sección 2: Planificador de Tareas / Calendario -->
        <div id="tareas-section" class="tab-content">
            <form id="task-form" class="form-container">
                <h2>Planificar Nueva Tarea</h2>
                
                <div class="form-group">
                    <label for="task-nombre">Nombre de la Tarea / Proyecto</label>
                    <input type="text" id="task-nombre" placeholder="Ej: Diseño de Logo, Reparación Web" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-fecha">Fecha Programada</label>
                        <input type="date" id="task-fecha" required>
                    </div>
                    <div class="form-group">
                        <label for="task-tipo-pago">Tipo de Pago</label>
                        <select id="task-tipo-pago" class="input-select">
                            <option value="por_hora">Por Horas Estimadas</option>
                            <option value="fijo">Precio Fijo Total</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" id="group-horas-est">
                        <label for="task-horas">Horas Estimadas</label>
                        <input type="number" id="task-horas" step="0.5" min="0.5" value="2" placeholder="Ej: 4">
                    </div>
                    <div class="form-group">
                        <label id="label-precio-tarea" for="task-precio">Precio por Hora (€ o $)</label>
                        <input type="number" id="task-precio" step="0.01" min="0" placeholder="Ej: 15.00" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Programar Tarea</button>
            </form>

            <div class="history-container">
                <h2>Lista de Tareas Pendientes y Realizadas</h2>
                <div id="lista-tareas" class="tasks-list">
                    <!-- Tareas cargadas dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Historial General de Registros -->
        <div class="history-container">
            <h2>Historial de Registros Realizados</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Horas</th>
                            <th>Ganado</th>
                            <th>Notas / Tarea</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="registros-tabla">
                        <!-- Las filas se cargan dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
